<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mandate Retry Orchestrator — Trace Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --panel-2: #1d222a;
    --border: #2a2f38;
    --text: #e6e9ef;
    --text-dim: #9399a6;
    --accent: #4f8cff;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;

    /* Semantic stage/outcome tokens -- used consistently as left-border
       accents, icon color, and badge fills across every entry type, so
       the timeline is skimmable by color alone. See /help for the
       legend. */
    --c-failure: #d29922;
    --c-rule: #58a6ff;
    --c-llm: #b06bff;
    --c-retry: #2fae82;
    --c-escalate: #f0883e;
    --c-success: #3fb950;
    --c-failed: #f85149;
    --c-noop: #8b949e;
    --c-fallback: #39c5cf;
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  a { color: var(--accent); }

  /* ---- sidebar ---- */
  #sidebar {
    width: 360px;
    min-width: 300px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #sidebar-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 { font-size: 15px; margin: 0; }
  #sidebar-header h1 span { color: var(--text-dim); font-weight: 400; display: block; font-size: 11px; margin-top: 2px; }
  #help-link {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--panel-2); border: 1px solid var(--border);
    color: var(--text-dim); text-decoration: none; font-size: 13px; font-weight: 700;
  }
  #help-link:hover { color: var(--text); border-color: var(--accent); }

  .section-label {
    padding: 10px 14px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.04em;
    text-transform: uppercase; color: var(--text-dim);
  }
  #demo-section { border-bottom: 1px solid var(--border); flex: none; }
  #demo-list { padding: 0 10px 10px; display: flex; flex-direction: column; gap: 6px; }
  .demo-item {
    cursor: pointer; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--panel-2);
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    font-size: 12.5px;
  }
  .demo-item:hover { border-color: var(--accent); }
  .demo-item.selected { border-color: var(--accent); background: #1c2740; }
  .demo-item .demo-scenario { color: var(--text); }
  .demo-item .demo-mid { font-family: var(--mono); color: var(--accent); font-weight: 600; white-space: nowrap; }

  #all-mandates { display: flex; flex-direction: column; flex: 1; overflow: hidden; }
  #all-mandates > summary {
    cursor: pointer; list-style: none; padding: 10px 14px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim);
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px;
  }
  #all-mandates > summary::-webkit-details-marker { display: none; }
  #all-mandates > summary::before { content: "▸"; display: inline-block; transition: transform 0.15s; }
  #all-mandates[open] > summary::before { transform: rotate(90deg); }
  #all-mandates-body { display: flex; flex-direction: column; flex: 1; overflow: hidden; }

  #controls { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex: none; }
  #controls input, #controls select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 13px;
  }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px; align-self: flex-start;
    font-size: 11px; padding: 3px 8px; border-radius: 999px;
    background: #1c2740; border: 1px solid var(--accent); color: var(--text);
  }
  #mandate-list { flex: 1; overflow-y: auto; }
  .mandate-item {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    font-size: 13px;
  }
  .mandate-item:hover { background: var(--panel-2); }
  .mandate-item.selected { background: #1c2740; border-left: 3px solid var(--accent); }
  .mandate-item .mid { font-family: var(--mono); color: var(--accent); font-weight: 600; }
  .mandate-item .meta { color: var(--text-dim); font-size: 11px; margin-top: 2px; }

  /* ---- main ---- */
  #main { flex: 1; overflow-y: auto; padding: 24px 32px; min-width: 0; }
  #main-header { margin-bottom: 8px; }
  #main-header h2 { margin: 0 0 4px; font-size: 18px; }
  #main-header .sub { color: var(--text-dim); font-size: 13px; font-family: var(--mono); }
  #main-summary { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0 22px; }
  .outcome-chip {
    font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
    border: 1px solid var(--stage-color, var(--border));
    color: var(--stage-color, var(--text));
    background: color-mix(in srgb, var(--stage-color, var(--border)) 16%, var(--panel));
  }
  .summary-item { font-size: 12.5px; color: var(--text-dim); font-family: var(--mono); }
  #empty-state { color: var(--text-dim); padding: 60px 0; text-align: center; }

  #simulate-panel {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-bottom: 24px; padding: 10px 12px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
  }
  .simulate-label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); margin-right: 4px; }
  #sim-taxonomy {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    padding: 6px 8px; border-radius: 6px; font-size: 13px; max-width: 360px;
  }
  #sim-run {
    background: var(--accent); color: #06121f; border: none; font-weight: 700;
    padding: 6px 16px; border-radius: 6px; font-size: 13px; cursor: pointer;
  }
  #sim-run:hover { filter: brightness(1.1); }
  #sim-run:disabled { opacity: 0.6; cursor: default; filter: none; }
  #sim-status { font-size: 12.5px; color: var(--text-dim); font-family: var(--mono); }

  .live-run-banner {
    display: flex; align-items: center; gap: 8px;
    margin: 4px 0 6px 0; padding: 8px 12px;
    background: color-mix(in srgb, var(--accent) 16%, var(--panel));
    border: 1px solid var(--accent); border-radius: 8px;
    font-size: 12.5px; font-weight: 700; color: var(--text);
  }
  .live-run-banner .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse-ring 1.4s ease-in-out infinite; flex: none; }
  .live-run-banner.stale {
    background: var(--panel-2); border-color: var(--border); color: var(--text-dim); font-weight: 600;
  }
  .live-run-banner.stale .dot { background: var(--text-dim); animation: none; }

  .timeline { position: relative; padding-left: 44px; }
  .timeline::before {
    content: "";
    position: absolute; left: 19px; top: 2px; bottom: 2px; width: 3px;
    background: var(--border); border-radius: 2px;
  }
  .entry {
    position: relative;
    margin-bottom: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-left: 4px solid var(--stage-color, var(--border));
    border-radius: 8px;
    padding: 12px 14px;
  }
  .entry.is-llm { background: color-mix(in srgb, var(--stage-color, var(--llm)) 12%, var(--panel)); }
  .entry-icon-wrap {
    position: absolute; left: -44px; top: 12px;
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--stage-color, var(--border));
    color: var(--stage-color, var(--text-dim));
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .entry-icon-wrap svg { width: 15px; height: 15px; }
  .entry.current .entry-icon-wrap { animation: pulse-ring 1.8s ease-in-out infinite; }
  @keyframes pulse-ring {
    0%, 100% { box-shadow: 0 0 0 0 rgba(79, 140, 255, 0.55); }
    50% { box-shadow: 0 0 0 6px rgba(79, 140, 255, 0); }
  }
  .entry-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .entry-label { font-weight: 600; font-size: 14px; }
  .entry-time { font-family: var(--mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }
  .badge {
    display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: 0.03em;
    padding: 2px 6px; border-radius: 4px; margin-left: 8px; vertical-align: middle;
    text-transform: uppercase;
  }
  .badge.llm { background: var(--c-llm); color: #fff; }
  .badge.rule { background: var(--c-rule); color: #06121f; }
  .badge.safe-default { background: var(--c-noop); color: #111; }
  .badge.retry { background: var(--c-retry); color: #04201a; }
  .badge.escalate { background: var(--c-escalate); color: #2b1300; }
  .badge.outcome-success { background: var(--c-success); color: #04210b; }
  .badge.outcome-failed { background: var(--c-failed); color: #2b0705; }
  .badge.outcome-noop { background: var(--c-noop); color: #111; }
  .badge.taxonomy { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  .badge.escalation-type { background: var(--c-escalate); color: #2b1300; }
  .tooltip-target { cursor: help; border: none; font: inherit; }
  #badge-tooltip {
    position: fixed; z-index: 1000; max-width: 280px; display: none;
    background: var(--panel-2); border: 1px solid var(--accent); border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; color: var(--text); line-height: 1.4;
    box-shadow: 0 8px 24px rgba(0,0,0,0.45);
  }
  #badge-tooltip .tip-text { margin-bottom: 6px; }
  #badge-tooltip .tip-link { font-size: 11px; color: var(--accent); text-decoration: none; white-space: nowrap; }
  #badge-tooltip .tip-link:hover { text-decoration: underline; }

  .reasoning {
    margin-top: 8px;
    padding: 8px 10px;
    background: color-mix(in srgb, var(--stage-color, var(--llm)) 10%, transparent);
    border-left: 3px solid var(--stage-color, var(--llm));
    border-radius: 4px;
    font-size: 13px;
    font-style: italic;
    color: var(--text);
  }
  .detail-grid { margin-top: 8px; font-size: 12px; color: var(--text-dim); display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
  .detail-grid .k { color: var(--text-dim); }
  .detail-grid .v { color: var(--text); font-family: var(--mono); }
  .detail-grid .v .badge { margin-left: 0; }
  .table-wrap { overflow-x: auto; }
  .steps-table { margin-top: 8px; width: 100%; border-collapse: collapse; font-size: 12px; min-width: 420px; }
  .steps-table th, .steps-table td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--border); }
  .steps-table th { color: var(--text-dim); font-weight: 500; }
  .content-box { margin-top: 8px; padding: 8px 10px; background: var(--panel-2); border-radius: 4px; font-size: 13px; white-space: pre-wrap; }
  .type-tag { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }

  @media (max-width: 900px) {
    body { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
    #sidebar { width: 100%; min-width: 0; max-height: 46vh; border-right: none; border-bottom: 1px solid var(--border); }
    #main { padding: 16px; }
    .timeline { padding-left: 38px; }
    .entry-icon-wrap { left: -38px; width: 26px; height: 26px; }
  }
</style>
</head>
<body>

<svg style="display:none" aria-hidden="true">
  <symbol id="ic-failure" viewBox="0 0 24 24">
    <path d="M12 3 L22 20 H2 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    <line x1="12" y1="9" x2="12" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="17.2" r="1.1" fill="currentColor"/>
  </symbol>
  <symbol id="ic-classify" viewBox="0 0 24 24">
    <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="15.2" y1="15.2" x2="21" y2="21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-plan" viewBox="0 0 24 24">
    <path d="M4 6h16M4 12h10M4 18h13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="20" cy="12" r="1.4" fill="currentColor"/>
  </symbol>
  <symbol id="ic-execute" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <path d="M10 8.3l6 3.7-6 3.7z" fill="currentColor"/>
  </symbol>
  <symbol id="ic-fallback" viewBox="0 0 24 24">
    <path d="M21 11.5a8.38 8.38 0 0 1-4.7 7.6 8.5 8.5 0 0 1-3.8.9c-1.35 0-2.6-.31-3.72-.87L3 21l1.87-5.61A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3a8.5 8.5 0 0 1 8.5 8.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  </symbol>
  <symbol id="ic-audit" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="2"/>
    <line x1="12" y1="11" x2="12" y2="16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <circle cx="12" cy="7.7" r="1.15" fill="currentColor"/>
  </symbol>
</svg>

<div id="sidebar">
  <div id="sidebar-header">
    <h1>Mandate Retry Orchestrator<span>Trace viewer — read only</span></h1>
    <a id="help-link" href="/help" title="Legend &amp; glossary" aria-label="Legend and glossary">?</a>
  </div>

  <div id="demo-section">
    <div class="section-label">Demo scenarios</div>
    <div id="demo-list"></div>
  </div>

  <details id="all-mandates">
    <summary>All mandates <span id="all-count" class="text-dim" style="color:var(--text-dim);font-weight:400;text-transform:none;"></span></summary>
    <div id="all-mandates-body">
      <div id="controls">
        <input id="search" type="text" placeholder="Search id / customer_ref / rail...">
        <select id="escalation-filter" aria-label="Filter mandates by escalation">
          <option value="">Filter: All mandates</option>
          <option value="has:true">Escalated only</option>
          <option value="has:false">Not escalated</option>
          <optgroup label="By escalation type">
            <option value="type:rail_switch_recommended">Rail switch recommended</option>
            <option value="type:reauth_needed">Re-authorization needed</option>
            <option value="type:retry_exhausted_nudge">Retry exhausted (nudge)</option>
            <option value="type:merchant_escalation">Merchant escalation</option>
          </optgroup>
        </select>
        <div id="filter-chip" class="filter-chip" style="display:none"></div>
      </div>
      <div id="mandate-list"></div>
    </div>
  </details>
</div>

<div id="main">
  <div id="empty-state">Select a mandate on the left to view its trace.</div>
  <div id="main-header" style="display:none">
    <h2 id="main-title"></h2>
    <div class="sub" id="main-sub"></div>
    <div id="main-summary"></div>
    <div id="simulate-panel">
      <span class="simulate-label">Simulate a failure</span>
      <select id="sim-taxonomy" aria-label="Failure category to simulate"></select>
      <button id="sim-run" type="button">Run</button>
      <span id="sim-status" aria-live="polite"></span>
    </div>
  </div>
  <div class="timeline" id="timeline" style="display:none"></div>
</div>

<script>
let allMandates = [];
let demoScenarios = [];
let selectedId = null;
let GLOSSARY = null;

const FILTER_LABELS = {
  'has:true': 'Escalated only',
  'has:false': 'Not escalated',
  'type:rail_switch_recommended': 'Type: rail switch recommended',
  'type:reauth_needed': 'Type: re-authorization needed',
  'type:retry_exhausted_nudge': 'Type: retry exhausted (nudge)',
  'type:merchant_escalation': 'Type: merchant escalation',
};

const STAGE_ICON = {
  failure_event: 'ic-failure',
  classification: 'ic-classify',
  plan: 'ic-plan',
  retry_attempt: 'ic-execute',
  fallback_message: 'ic-fallback',
  audit_log: 'ic-audit',
};

function stageColor(e) {
  const d = e.detail || {};
  switch (e.entry_type) {
    case 'failure_event': return 'var(--c-failure)';
    case 'classification': return e.is_llm ? 'var(--c-llm)' : 'var(--c-rule)';
    case 'plan': return d.decision === 'retry' ? 'var(--c-retry)' : 'var(--c-escalate)';
    case 'retry_attempt':
      if (d.outcome === 'success') return 'var(--c-success)';
      if (d.outcome === 'failed') return 'var(--c-failed)';
      return 'var(--c-noop)';
    case 'fallback_message': return 'var(--c-fallback)';
    case 'audit_log': return 'var(--c-noop)';
    default: return null;
  }
}

function formatRupees(paise) {
  if (paise === null || paise === undefined) return 'n/a';
  return '₹' + (paise / 100).toFixed(2);
}

function formatDuration(ms) {
  if (ms === null || ms === undefined || isNaN(ms)) return null;
  if (ms < 0) ms = 0;
  const mins = Math.round(ms / 60000);
  if (mins < 60) return mins + 'm';
  const hrs = Math.floor(mins / 60);
  const remMins = mins % 60;
  if (hrs < 48) return hrs + 'h ' + remMins + 'm';
  const days = Math.floor(hrs / 24);
  return days + 'd ' + (hrs % 24) + 'h';
}

async function fetchMandates() {
  const filter = document.getElementById('escalation-filter').value;
  const params = new URLSearchParams();
  if (filter.startsWith('has:')) params.set('has_escalation', filter.slice(4));
  if (filter.startsWith('type:')) params.set('escalation_type', filter.slice(5));
  const res = await fetch('/mandates?' + params.toString());
  allMandates = await res.json();

  const chip = document.getElementById('filter-chip');
  if (filter && FILTER_LABELS[filter]) {
    chip.style.display = 'inline-flex';
    chip.textContent = 'Active filter: ' + FILTER_LABELS[filter];
  } else {
    chip.style.display = 'none';
  }

  renderMandateList();
}

async function loadGlossaryData() {
  const res = await fetch('/api/glossary');
  GLOSSARY = await res.json();
}

// Tooltip content is resolved lazily against GLOSSARY (fetched once,
// shared with /help) rather than baked into each badge's HTML at render
// time -- one source of truth, no separately-maintained copy per badge.
function resolveTooltip(key) {
  if (!GLOSSARY || !key) return '';
  const sep = key.indexOf(':');
  const kind = key.slice(0, sep);
  const value = key.slice(sep + 1);
  if (kind === 'taxonomy') {
    const row = GLOSSARY.taxonomy.find(r => r.id === value);
    return row ? `${row.rail} — ${row.failure}` : '';
  }
  if (kind === 'escalation') return GLOSSARY.escalation_types[value] || '';
  if (kind === 'badge') return GLOSSARY.badges[value] || '';
  return '';
}

let tooltipEl = null;
function ensureTooltip() {
  if (!tooltipEl) {
    tooltipEl = document.createElement('div');
    tooltipEl.id = 'badge-tooltip';
    document.body.appendChild(tooltipEl);
  }
  return tooltipEl;
}
function showTooltip(target) {
  const text = resolveTooltip(target.getAttribute('data-tooltip-key'));
  if (!text) return;
  const tip = ensureTooltip();
  tip.innerHTML = `<div class="tip-text">${escapeHtml(text)}</div><a class="tip-link" href="/help" target="_blank" rel="noopener">See full glossary &rarr;</a>`;
  tip.style.display = 'block';
  const rect = target.getBoundingClientRect();
  const tipRect = tip.getBoundingClientRect();
  let left = rect.left + rect.width / 2 - tipRect.width / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));
  let top = rect.top - tipRect.height - 8;
  if (top < 8) top = rect.bottom + 8;
  tip.style.left = left + 'px';
  tip.style.top = top + 'px';
}
function hideTooltip() {
  if (tooltipEl) tooltipEl.style.display = 'none';
}
document.addEventListener('mouseover', e => {
  const t = e.target.closest('.tooltip-target');
  if (t) showTooltip(t);
});
document.addEventListener('mouseout', e => {
  const t = e.target.closest('.tooltip-target');
  if (t) hideTooltip();
});
document.addEventListener('focusin', e => {
  const t = e.target.closest('.tooltip-target');
  if (t) showTooltip(t);
});
document.addEventListener('focusout', e => {
  const t = e.target.closest('.tooltip-target');
  if (t) hideTooltip();
});
document.addEventListener('click', e => {
  const t = e.target.closest('.tooltip-target');
  if (t) { e.preventDefault(); showTooltip(t); return; }
  if (!e.target.closest('#badge-tooltip')) hideTooltip();
});

async function loadDemoScenarios() {
  const res = await fetch('/api/demo-scenarios');
  demoScenarios = await res.json();
  renderDemoList();
}

function renderDemoList() {
  const list = document.getElementById('demo-list');
  list.innerHTML = '';
  for (const s of demoScenarios) {
    const div = document.createElement('div');
    div.className = 'demo-item' + (s.mandate_id === selectedId ? ' selected' : '');
    div.tabIndex = 0;
    div.innerHTML = `<span class="demo-scenario">${escapeHtml(s.scenario)}</span><span class="demo-mid">#${s.mandate_id}</span>`;
    div.onclick = () => selectMandate(s.mandate_id);
    div.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectMandate(s.mandate_id); } };
    list.appendChild(div);
  }
}

function renderMandateList() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const list = document.getElementById('mandate-list');
  list.innerHTML = '';
  const filtered = allMandates.filter(m =>
    !q || String(m.id).includes(q) || m.customer_ref.toLowerCase().includes(q) || m.rail.toLowerCase().includes(q)
  );
  document.getElementById('all-count').textContent = '(' + allMandates.length + ')';
  if (filtered.length === 0) {
    list.innerHTML = '<div class="mandate-item" style="color:var(--text-dim)">No mandates match.</div>';
    return;
  }
  for (const m of filtered) {
    const div = document.createElement('div');
    div.className = 'mandate-item' + (m.id === selectedId ? ' selected' : '');
    div.tabIndex = 0;
    div.innerHTML = `<span class="mid">#${m.id}</span> &nbsp; ${escapeHtml(m.customer_ref)}
      <div class="meta">${escapeHtml(m.rail)} · ${formatRupees(m.amount)} · ${escapeHtml(m.status)}</div>`;
    div.onclick = () => selectMandate(m.id);
    div.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); selectMandate(m.id); } };
    list.appendChild(div);
  }
}

async function findMandate(id) {
  const cached = allMandates.find(m => m.id === id);
  if (cached) return cached;
  const res = await fetch(`/mandates/${id}`);
  if (!res.ok) return null;
  return res.json();
}

function computeSummary(entries) {
  if (entries.length === 0) {
    return { label: 'No failure events recorded', cls: null, elapsed: null, costPaise: 0, hasCost: false };
  }
  const successAttempt = entries.find(e => e.entry_type === 'retry_attempt' && e.detail.outcome === 'success');
  const fallback = [...entries].reverse().find(e => e.entry_type === 'fallback_message');
  const escalatePlan = [...entries].reverse().find(e => e.entry_type === 'plan' && e.detail.decision === 'escalate');
  const lastAttempt = [...entries].reverse().find(e => e.entry_type === 'retry_attempt');

  let label, cls;
  if (successAttempt) {
    label = `Recovered on attempt #${successAttempt.detail.attempt_number}`;
    cls = 'var(--c-success)';
  } else if (fallback) {
    label = 'Escalated: ' + fallback.detail.escalation_type.replace(/_/g, ' ');
    cls = 'var(--c-escalate)';
  } else if (escalatePlan) {
    label = 'Escalated: ' + (escalatePlan.detail.escalation_reason_code || '').replace(/_/g, ' ');
    cls = 'var(--c-escalate)';
  } else if (lastAttempt) {
    label = `Attempt #${lastAttempt.detail.attempt_number}: ${lastAttempt.detail.outcome}`;
    cls = lastAttempt.detail.outcome === 'failed' ? 'var(--c-failed)' : 'var(--c-noop)';
  } else {
    label = 'Pending — classified, no plan yet';
    cls = 'var(--c-noop)';
  }

  const first = new Date(entries[0].timestamp);
  const last = new Date(entries[entries.length - 1].timestamp);
  const elapsed = formatDuration(last - first);

  let costPaise = 0;
  let hasCost = false;
  for (const e of entries) {
    if (e.entry_type === 'plan' && e.detail.steps) {
      for (const s of e.detail.steps) { costPaise += s.cost; hasCost = true; }
    }
  }

  return { label, cls, elapsed, costPaise, hasCost };
}

async function selectMandate(id) {
  selectedId = id;
  renderMandateList();
  renderDemoList();
  const mandate = await findMandate(id);
  const res = await fetch(`/mandates/${id}/trace`);
  const entries = await res.json();
  renderTrace(mandate, entries);
  loadSimulateOptions(id);
}

// Shared by selectMandate (fetches the trace) and the simulate "Run"
// handler (already has the trace from the POST response) -- one render
// path, so a live simulated run looks exactly like the same mandate
// reloaded normally, except for the live-run banner.
function renderTrace(mandate, entries) {
  const id = mandate ? mandate.id : selectedId;
  document.getElementById('empty-state').style.display = 'none';
  document.getElementById('main-header').style.display = '';
  document.getElementById('timeline').style.display = '';
  document.getElementById('main-title').textContent = `Mandate #${id} — ${mandate ? mandate.customer_ref : ''}`;
  document.getElementById('main-sub').textContent = mandate
    ? `${mandate.rail} · ${formatRupees(mandate.amount)} · expires ${mandate.mandate_expiry}`
    : '';

  const summary = computeSummary(entries);
  const summaryEl = document.getElementById('main-summary');
  let summaryHtml = `<span class="outcome-chip" style="--stage-color:${summary.cls || 'var(--border)'}">${escapeHtml(summary.label)}</span>`;
  if (summary.elapsed) summaryHtml += `<span class="summary-item">Elapsed: ${summary.elapsed}</span>`;
  if (summary.hasCost) summaryHtml += `<span class="summary-item">Retry cost: ${formatRupees(summary.costPaise)}</span>`;
  summaryEl.innerHTML = summaryHtml;

  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';
  if (entries.length === 0) {
    timeline.innerHTML = '<div style="color:var(--text-dim)">No failure events recorded for this mandate yet.</div>';
    return;
  }

  // A failure_event is "live" if the simulate endpoint tagged it via an
  // audit_log marker (see app/routers/mandates.py's simulate_failure).
  // Only the most recently occurring one gets the prominent banner --
  // older simulated runs, from earlier retakes, read as ordinary history.
  const liveIds = new Set(
    entries
      .filter(e => e.entry_type === 'audit_log' && e.detail.event_type === 'live_simulation_triggered')
      .map(e => e.detail.related_entity_id)
  );
  const failureEventIds = entries.filter(e => e.entry_type === 'failure_event').map(e => e.detail.id);
  const mostRecentFailureEventId = failureEventIds[failureEventIds.length - 1];
  const mostRecentEntry = entries[entries.length - 1];

  // The API returns entries in true chronological order (oldest first --
  // required for computeSummary's first/last-occurrence logic above, and
  // for GET /mandates/{id}/trace's own documented contract). The
  // timeline display, though, should surface the newest failure first so
  // a just-triggered simulate run doesn't require scrolling to the
  // bottom to see. Group by failure_event and reverse the *groups*, but
  // keep each group's own entries in their original causal order --
  // reversing individual entries too would render a fallback message
  // above the failure it explains, which reads backwards. Safe to assume
  // each failure_event's entries arrive contiguously: build_mandate_trace
  // sorts primarily by the owning event's occurred_at (see its docstring)
  // specifically so a slow LLM call on one event can't interleave its
  // entries with a different, faster event's.
  const groups = [];
  for (const e of entries) {
    if (e.entry_type === 'failure_event') {
      groups.push([e]);
    } else {
      groups[groups.length - 1].push(e);
    }
  }

  for (const group of groups.slice().reverse()) {
    const first = group[0];
    if (first.entry_type === 'failure_event' && liveIds.has(first.detail.id)) {
      const isMostRecent = first.detail.id === mostRecentFailureEventId;
      const banner = document.createElement('div');
      banner.className = 'live-run-banner' + (isMostRecent ? '' : ' stale');
      banner.innerHTML = isMostRecent
        ? '<span class="dot"></span> LIVE SIMULATED RUN — triggered just now from this page'
        : '<span class="dot"></span> Previously simulated run (not the current one)';
      timeline.appendChild(banner);
    }
    for (const e of group) {
      timeline.appendChild(renderEntry(e, e === mostRecentEntry));
    }
  }
}

async function loadSimulateOptions(mandateId) {
  const select = document.getElementById('sim-taxonomy');
  select.innerHTML = '<option>Loading…</option>';
  const res = await fetch(`/mandates/${mandateId}/simulate-failure/options`);
  const options = await res.json();
  select.innerHTML = '';
  for (const opt of options) {
    const el = document.createElement('option');
    el.value = opt.id;
    el.textContent = `${opt.id} — ${opt.description}`;
    select.appendChild(el);
  }
}

const SIM_STAGES = ['Injecting failure…', 'Classifying…', 'Planning…', 'Executing / escalating…'];

async function runSimulation() {
  if (!selectedId) return;
  const taxonomyId = document.getElementById('sim-taxonomy').value;
  if (!taxonomyId) return;

  const runBtn = document.getElementById('sim-run');
  const select = document.getElementById('sim-taxonomy');
  const status = document.getElementById('sim-status');
  runBtn.disabled = true;
  select.disabled = true;

  let stage = 0;
  status.textContent = SIM_STAGES[0];
  const stageTimer = setInterval(() => {
    stage = Math.min(stage + 1, SIM_STAGES.length - 1);
    status.textContent = SIM_STAGES[stage];
  }, 550);

  try {
    const res = await fetch(`/mandates/${selectedId}/simulate-failure`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ taxonomy_id: taxonomyId }),
    });
    clearInterval(stageTimer);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      status.textContent = 'Error: ' + (body.detail || res.statusText);
      return;
    }
    const entries = await res.json();
    status.textContent = 'Done.';
    const mandate = await findMandate(selectedId);
    renderTrace(mandate, entries);
    fetchMandates(); // refresh sidebar counts/filters in the background
    setTimeout(() => { if (status.textContent === 'Done.') status.textContent = ''; }, 4000);
  } catch (err) {
    clearInterval(stageTimer);
    status.textContent = 'Error: ' + String(err);
  } finally {
    runBtn.disabled = false;
    select.disabled = false;
  }
}

document.getElementById('sim-run').addEventListener('click', runSimulation);

function tooltipBadge(cls, label, tooltipKey) {
  return `<span class="badge ${cls} tooltip-target" tabindex="0" data-tooltip-key="${tooltipKey}">${escapeHtml(label)}</span>`;
}

function renderEntry(e, isCurrent) {
  const div = document.createElement('div');
  const color = stageColor(e);
  div.className = 'entry' + (e.is_llm ? ' is-llm' : '') + (isCurrent ? ' current' : '');
  if (color) div.style.setProperty('--stage-color', color);

  const icon = STAGE_ICON[e.entry_type] || 'ic-audit';

  let badge = '';
  if (e.entry_type === 'failure_event') {
    const code = e.detail.taxonomy_id;
    badge = tooltipBadge('taxonomy', code, `taxonomy:${code}`);
  } else if (e.entry_type === 'classification') {
    badge = e.is_llm ? tooltipBadge('llm', 'LLM', 'badge:llm') : tooltipBadge('rule', 'RULE', 'badge:rule');
  } else if (e.entry_type === 'fallback_message') {
    badge = e.is_llm ? tooltipBadge('llm', 'LLM', 'badge:llm') : tooltipBadge('safe-default', 'SAFE DEFAULT', 'badge:safe_default');
    badge += ' ' + tooltipBadge('escalation-type', e.detail.escalation_type.replace(/_/g, ' ').toUpperCase(), `escalation:${e.detail.escalation_type}`);
  } else if (e.entry_type === 'plan') {
    badge = e.detail.decision === 'retry'
      ? tooltipBadge('retry', 'RETRY', 'badge:retry')
      : tooltipBadge('escalate', 'ESCALATE', 'badge:escalate');
  }

  let body = `
    <div class="entry-icon-wrap"><svg><use href="#${icon}"></use></svg></div>
    <div class="type-tag">${e.entry_type.replace(/_/g, ' ')}</div>
    <div class="entry-top">
      <div class="entry-label">${escapeHtml(e.label)}${badge}</div>
      <div class="entry-time">${e.timestamp.replace('T', ' ')}</div>
    </div>`;

  const d = e.detail || {};

  if (e.entry_type === 'failure_event') {
    body += `<div class="content-box">${escapeHtml(d.raw_reason_text)}</div>`;
    body += `<div class="detail-grid">
      <div class="k">ground_truth_recoverable</div><div class="v">${d.ground_truth_recoverable}</div>
    </div>`;
  } else if (e.entry_type === 'classification') {
    if (d.reasoning) body += `<div class="reasoning">${escapeHtml(d.reasoning)}</div>`;
    body += `<div class="detail-grid">
      <div class="k">confidence</div><div class="v">${d.confidence ?? 'n/a'}</div>
    </div>`;
  } else if (e.entry_type === 'plan') {
    if (d.reasoning) body += `<div class="reasoning">${escapeHtml(d.reasoning)}</div>`;
    if (d.steps && d.steps.length) {
      body += `<div class="table-wrap"><table class="steps-table"><tr><th>#</th><th>proposed_at</th><th>p(success)</th><th>cost</th></tr>`;
      for (const s of d.steps) {
        body += `<tr><td>${s.attempt_number}</td><td>${s.proposed_timestamp.replace('T', ' ')}</td><td>${s.success_probability.toFixed(2)}</td><td>${formatRupees(s.cost)}</td></tr>`;
      }
      body += `</table></div>`;
    }
    if (d.expected_value !== null && d.expected_value !== undefined) {
      body += `<div class="detail-grid"><div class="k">expected_value</div><div class="v">${formatRupees(d.expected_value)}</div></div>`;
    }
  } else if (e.entry_type === 'retry_attempt') {
    const ocKey = d.outcome === 'success' ? 'outcome_success' : d.outcome === 'failed' ? 'outcome_failed' : 'outcome_noop';
    const ocCls = ocKey.replace('_', '-');
    body += `<div class="detail-grid">
      <div class="k">outcome</div><div class="v">${tooltipBadge(ocCls, d.outcome.toUpperCase(), `badge:${ocKey}`)}</div>
      <div class="k">scheduled_at</div><div class="v">${d.scheduled_at.replace('T', ' ')}</div>
      <div class="k">executed_at</div><div class="v">${d.executed_at ? d.executed_at.replace('T', ' ') : '—'}</div>
    </div>`;
  } else if (e.entry_type === 'fallback_message') {
    body += `<div class="content-box">${escapeHtml(d.content)}</div>`;
    body += `<div class="detail-grid">
      <div class="k">validation_passed</div><div class="v">${d.validation_passed}</div>
      ${d.validation_detail ? `<div class="k">validation_detail</div><div class="v">${escapeHtml(d.validation_detail)}</div>` : ''}
    </div>`;
  } else if (e.entry_type === 'audit_log') {
    body += `<div class="detail-grid">
      <div class="k">event_type</div><div class="v">${d.event_type}</div>
    </div>`;
    if (d.detail) body += `<div class="content-box" style="font-size:11px">${escapeHtml(JSON.stringify(d.detail))}</div>`;
  }

  div.innerHTML = body;
  return div;
}

function escapeHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

document.getElementById('search').addEventListener('input', () => {
  if (document.getElementById('search').value.trim()) {
    document.getElementById('all-mandates').open = true;
  }
  renderMandateList();
});
document.getElementById('escalation-filter').addEventListener('change', fetchMandates);

loadGlossaryData();
loadDemoScenarios();
fetchMandates().then(() => {
  const deepLink = new URLSearchParams(location.search).get('mandate');
  if (deepLink) selectMandate(Number(deepLink));
});
</script>
